buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://plugins.gradle.org/m2/' }
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath 'com.hypherionmc.modutils:modpublisher:2.0.4'
    }
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
if (project.file('../gradletools.gradle').exists()) {
    apply from: '../gradletools.gradle'
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/1.20_tech/gradletools.gradle'
}

group = "com.github.mcjty"
archivesBaseName = "arienteworld"
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repos()
// Standalone verification before the matching dependencies are published.
if (project.hasProperty('ariente_dependency_repository')) {
    repositories.maven {
        url = uri(project.property('ariente_dependency_repository'))
        content {
            includeGroup 'com.github.mcjty'
        }
    }
}
if (project.hasProperty('ariente_runs')) {
    ext.enable_individual_runs = true
}
runs('arienteworld')
jars('arienteworld')
// This mod needs no access transformations; the shared jar helper adds this by default.
tasks.named('jar') {
    manifest.attributes.remove('FMLAT')
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    mc()
    jei()
    top()
    mcjtylib()
    if (findProject(':ModHoloGui') != null) {
        implementation(project(':ModHoloGui')) { transitive = false }
    } else {
        implementation fg.deobf("com.github.mcjty:hologui:${hologui_version}") { transitive = false }
    }
    if (findProject(':Ariente') != null) {
        implementation(project(':Ariente')) { transitive = false }
    } else {
        implementation fg.deobf("com.github.mcjty:ariente:${ariente_version}") { transitive = false }
    }

}

modpublisher(['the-one-probe'], ['mcjtylib', 'hologui', 'ariente'],
        ['the-one-probe'], ['mcjtylib', 'hologui', 'ariente'], [])

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = archivesBaseName
            from components.java
        }
    }
    repositories {
        if (project.hasProperty('mavendir')) {
            maven { url mavendir }
        } else {
            mavenLocal()
        }
    }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.withType(AbstractPublishToMaven).configureEach {
    dependsOn 'reobfJar'
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

// An isolated development run for this port, using the included dependency sources.
if (findProject(':Ariente') != null && project.hasProperty('ariente_runs')) {
    [':Ariente', ':ModHoloGui', ':McJtyLib', ':TheOneProbe'].each { evaluationDependsOn(it) }
    minecraft.runs {
        gameTestServer {
            workingDirectory project.file('build/gametest')
            property 'forge.enabledGameTestNamespaces', 'arienteworld'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            source sourceSets.main
            mods {
                arienteworld {
                    source sourceSets.gameTest
                }
            }
        }
    }
    minecraft.runs.all {
        forceExit false
        jvmArgs '-Xmx2G'
        mods {
            arienteworld {
                source sourceSets.main
            }
            ariente {
                source project(':Ariente').sourceSets.main
            }
            hologui {
                source project(':ModHoloGui').sourceSets.main
            }
            mcjtylib {
                source project(':McJtyLib').sourceSets.main
            }
            theoneprobe {
                source project(':TheOneProbe').sourceSets.main
            }
        }
    }
    minecraft.runs.data {
        getArgs().clear()
        args '--mod', 'arienteworld', '--all', '--output', file('build/verification/datagen').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        workingDirectory file('build/verification/datagen-run')
    }
}

// Resolve Forge/remapped libraries in this project; load local mod sources directly.
configurations.implementation.dependencies.withType(ProjectDependency).configureEach { dependency ->
    dependency.transitive = false
}

// Forge otherwise prefers the versioned local jars over the supplied source folders.
// Keep compilation dependencies, but use source outputs in development launches.
tasks.withType(JavaExec).configureEach {
    if (name.startsWith('run')) {
        doFirst {
            def localJarDirs = rootProject.subprojects.collect { it.layout.buildDirectory.dir('libs').get().asFile.toPath() }
            def useInRun = { File entry -> !localJarDirs.any { entry.toPath().startsWith(it) } }
            classpath = classpath.filter(useInRun)
            if (systemProperties['legacyClassPath']) {
                systemProperty 'legacyClassPath', systemProperties['legacyClassPath'].toString()
                        .split(File.pathSeparator).findAll { useInRun(new File(it)) }.join(File.pathSeparator)
            }
        }
    }
}
