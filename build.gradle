buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

def localGradleTools = [
        project.findProperty('gradletools_path') ? file(project.property('gradletools_path')) : null,
        rootProject.file('gradletools.gradle'),
        file('../Multi_neo/gradletools.gradle'),
        file('gradletools.gradle')
].find { it != null && it.isFile() }
apply from: localGradleTools ?: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.2_neo/gradletools.gradle'



group = "com.github.mcjty"
base.archivesName = "arienteworld"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neo_version = '26.2.0.75'

if (System.getenv('BUILD_NUMBER') != null) {
    version += "-${System.getenv('BUILD_NUMBER')}"
}

repos()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    mc()
    jei()
    // Patchouli has no compatible 26.2 release; the manual remains optional.
    top()
    mcjtylib()
    if (findProject(':ModHoloGui') != null) {
        implementation project(':ModHoloGui')
    } else {
        implementation("com.github.mcjty:hologui:${hologui_version}") { transitive = false }
    }
    if (findProject(':Ariente') != null) {
        implementation project(':Ariente')
    } else {
        implementation("com.github.mcjty:ariente:${ariente_version}") { transitive = false }
    }
}

// Unpublished dependency artifacts can be staged for standalone verification.
if (project.hasProperty('ariente_dependency_repository')) {
    repositories.maven { url = uri(project.property('ariente_dependency_repository')) }
}

modpublisher(['the-one-probe'], ['mcjtylib', 'hologui', 'ariente'], ['the-one-probe'], ['mcjtylib', 'hologui', 'ariente'], [])

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = base.archivesName.get()
        }
    }
    repositories {
        if (project.hasProperty('mavendir')) {
            maven { url = uri(project.property('mavendir')) }
        } else if (System.getenv('local_maven') != null) {
            maven { url = uri(System.getenv('local_maven')) }
        } else {
            mavenLocal()
        }
    }
}


// NeoGradle consumes local mod source sets in development, including transitive mod dependencies.
def localMods = ['McJtyLib', 'TheOneProbe', 'ModHoloGui', 'Ariente']
localMods.findAll { findProject(":" + it) != null }.each { modName ->
    evaluationDependsOn(":" + modName)
    runs { configureEach { modSource project(":" + modName).sourceSets.main } }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        java.include 'mcjty/arienteworld/PortSmokeTests.java', 'mcjty/arienteworld/PortClientSmoke.java'
        resources.include 'data/arienteworld/structure/empty.nbt', 'data/minecraft/worldgen/world_preset/flat.json'
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
runs {
    configureEach {
        workingDirectory project.file("build/verification/${name}")
    }
    gameTestServer {
        systemProperty "neoforge.enabledGameTestNamespaces", "ariente,arienteworld"
        modSource sourceSets.gameTest
        if (findProject(":Ariente") != null) { modSource project(":Ariente").sourceSets.gameTest }
    }
}

if (project.hasProperty('port_client_smoke')) {
    runs {
        client {
            modSource sourceSets.gameTest
            systemProperty 'ariente.portClientSmoke', 'true'
            arguments.addAll '--quickPlaySingleplayer', 'PortSmoke'
        }
    }
}

// FML must load the included checkouts, including fixtures, instead of choosing duplicate dependency jars.
tasks.withType(JavaExec).configureEach {
    doFirst {
        def sourceJars = localMods.collect { findProject(":" + it) }.findAll { it != null }
                .collect { it.tasks.named('jar', Jar).get().archiveFile.get().asFile } as Set
        classpath = classpath.filter { !sourceJars.contains(it) }
    }
}
