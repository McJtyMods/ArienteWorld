// Opt-in tutorial creation and persistence checks using the native Fabric server.
gradle.afterProject { p ->
    if (p.name == 'ArienteWorld' || p.findProperty('mod_id') == 'arienteworld') {
        p.sourceSets {
            tutorial {
                compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
                runtimeClasspath += p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
                java.include 'mcjty/arienteworld/tutorial/TutorialWorld.java'
                java.include 'mcjty/arienteworld/tutorial/TutorialPortChecks.java'
                java.include 'mcjty/arienteworld/tutorial/TutorialEntrypoint.java'
                java.srcDir 'src/gameTest/java'
                java.include 'mcjty/arienteworld/PortClientSmoke.java'
                java.include 'mcjty/arienteworld/PortRenderChecks.java'
                java.include 'mcjty/arienteworld/PortLiveCameraChecks.java'
                java.include 'mcjty/arienteworld/PortShipHudChecks.java'
            }
        }
        p.configurations {
            tutorialImplementation.extendsFrom implementation
            tutorialCompileOnly.extendsFrom compileOnly
            tutorialRuntimeOnly.extendsFrom runtimeOnly
        }
        p.loom {
            mods {
                ariente_tutorial { sourceSet p.sourceSets.tutorial }
            }
            runs {
                server {
                    server()
                    runDir(p.findProperty('tutorial_directory') ?: 'build/tutorial/server')
                    vmArg '-Dariente.tutorial=true'
                    vmArg '-Dariente.tutorial.verify=' + (p.findProperty('tutorial_verify') ?: 'false')
                    programArg '--nogui'
                }
            }
        }
        if (p.hasProperty('tutorial_client_smoke') || p.hasProperty('tutorial_render_checks') || p.hasProperty('tutorial_live_camera_checks') || p.hasProperty('tutorial_ship_hud_checks')) {
            p.loom.runs.client {
                client()
                runDir(p.findProperty('tutorial_client_directory') ?: 'build/tutorial/client')
                vmArg '-Dariente.portClientSmoke=' + p.hasProperty('tutorial_client_smoke')
                vmArg '-Dariente.portRenderChecks=' + p.hasProperty('tutorial_render_checks')
                vmArg '-Dariente.portLiveCameraChecks=' + p.hasProperty('tutorial_live_camera_checks')
                vmArg '-Dariente.portShipHudChecks=' + p.hasProperty('tutorial_ship_hud_checks')
                vmArg '-Dariente.shipHudFabulous=' + p.hasProperty('tutorial_ship_hud_fabulous')
                vmArg '-Dariente.liveCameraFabulous=' + p.hasProperty('tutorial_live_camera_fabulous')
                programArgs '--quickPlaySingleplayer', 'PortSmoke', '--width', '1280', '--height', '800'
            }
            p.tasks.named('runClient') {
                dependsOn p.tasks.named('tutorialClasses')
                classpath += p.sourceSets.tutorial.output
            }
        }
        p.tasks.named('runServer') {
            dependsOn p.tasks.named('tutorialClasses')
            classpath += p.sourceSets.tutorial.output
        }
    }
}
