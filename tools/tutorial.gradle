// Opt-in map authoring. No tutorial code is included in the released mod.
gradle.afterProject { p ->
    if (p.name == 'ArienteWorld') {
        p.sourceSets {
            tutorial {
                compileClasspath += p.sourceSets.main.output
                runtimeClasspath += p.sourceSets.main.output
            }
        }
        p.configurations {
            tutorialImplementation.extendsFrom implementation
            tutorialCompileOnly.extendsFrom compileOnly
            tutorialRuntimeOnly.extendsFrom runtimeOnly
        }
        p.runs {
            server {
                modSource p.sourceSets.tutorial
                workingDirectory p.file(p.findProperty('tutorial_directory') ?: 'build/tutorial/server')
                systemProperty 'ariente.tutorial', 'true'
                systemProperty 'ariente.tutorial.verify', (p.findProperty('tutorial_verify') ?: 'false').toString()
                systemProperty 'forge.logging.console.level', 'info'
                argument '--nogui'
            }
        }
        def armorCheck = p.hasProperty('tutorial_armor_check')
        def positionCheck = p.hasProperty('tutorial_position_check')
        def soundCheck = p.hasProperty('tutorial_forcefield_sound_check')
        def renderCheck = p.hasProperty('tutorial_render_regression')
        if (p.hasProperty('tutorial_preview') || positionCheck || soundCheck || renderCheck || armorCheck) {
            p.runs {
                client {
                    modSource p.sourceSets.tutorial
                    workingDirectory p.file(p.findProperty('tutorial_client_directory') ?: 'build/tutorial/client')
                    systemProperty 'ariente.tutorial.fabulous', p.hasProperty('tutorial_fabulous').toString()
                    systemProperty 'ariente.tutorial.preview', (!positionCheck && !soundCheck && !renderCheck && !armorCheck).toString()
                    systemProperty 'ariente.tutorial.renderRegression', renderCheck.toString()
                    systemProperty 'ariente.tutorial.armorCheck', armorCheck.toString()
                    systemProperty 'ariente.tutorial.positionCheck', positionCheck.toString()
                    systemProperty 'ariente.tutorial.forcefieldSoundCheck', soundCheck.toString()
                    systemProperty 'ariente.tutorial.soundBaseline', p.hasProperty('tutorial_sound_baseline').toString()
                    systemProperty 'ariente.tutorial.scene', (p.findProperty('tutorial_scene') ?: '0').toString()
                    arguments.addAll '--quickPlaySingleplayer', 'Tutorial', '--width', '1280', '--height', '800'
                }
            }
        }
        p.tasks.withType(JavaExec).configureEach {
            if (name == 'runServer' || (name == 'runClient' && (p.hasProperty('tutorial_preview') || positionCheck || soundCheck || renderCheck || armorCheck))) {
                dependsOn p.tasks.named('tutorialClasses')
            }
        }
    }
}
