// Opt-in map authoring and visual checks. Tutorial code stays outside released jars.
gradle.afterProject { p ->
    if (p.name == 'ArienteWorld' || p.findProperty('mod_id') == 'arienteworld') {
        p.sourceSets {
            tutorial {
                compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
                runtimeClasspath += p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
            }
        }
        p.patchouli()
        p.loom.mods.register('ariente_tutorial') { sourceSet p.sourceSets.tutorial }
        // Loom 1.10 treats runDir as relative to the project, including absolute strings.
        def runPath = { value ->
            p.projectDir.toPath().relativize(p.file(value).toPath()).toString()
        }
        p.loom.runs.server {
            runDir runPath(p.findProperty('tutorial_directory') ?: 'build/tutorial/server')
            vmArg '-Dariente.tutorial=true'
            vmArg '-Dariente.tutorial.verify=' + (p.findProperty('tutorial_verify') ?: 'false')
        }
        def positionCheck = p.hasProperty('tutorial_position_check')
        def soundCheck = p.hasProperty('tutorial_forcefield_sound_check')
        if (p.hasProperty('tutorial_preview') || soundCheck || positionCheck) {
            p.loom.runs.client {
                runDir runPath(p.findProperty('tutorial_client_directory') ?: 'build/tutorial/client')
                vmArg '-Dariente.tutorial.fabulous=' + p.hasProperty('tutorial_fabulous')
                vmArg '-Dariente.tutorial.preview=' + (!soundCheck && !positionCheck)
                vmArg '-Dariente.tutorial.positionCheck=' + positionCheck
                vmArg '-Dariente.tutorial.forcefieldSoundCheck=' + soundCheck
                vmArg '-Dariente.tutorial.soundBaseline=' + p.hasProperty('tutorial_sound_baseline')
                vmArg '-Dariente.tutorial.scene=' + (p.findProperty('tutorial_scene') ?: '0')
                programArgs '--quickPlaySingleplayer', 'Tutorial', '--width', '1280', '--height', '800'
            }
            p.tasks.named('runClient') {
                dependsOn p.tasks.named('tutorialClasses')
                classpath += p.sourceSets.tutorial.output
            }
        }
        p.tasks.named('runServer') {
            dependsOn p.tasks.named('tutorialClasses')
            classpath += p.sourceSets.tutorial.output
        }
    }
}
