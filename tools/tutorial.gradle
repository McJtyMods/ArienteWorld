// Opt-in map authoring. No tutorial code is included in the released mod.
gradle.afterProject { p ->
    if (p.name == 'ArienteWorld') {
        p.sourceSets {
            tutorial {
                compileClasspath += p.sourceSets.main.output
                runtimeClasspath += p.sourceSets.main.output
            }
        }
        p.configurations {
            tutorialImplementation.extendsFrom implementation
            tutorialCompileOnly.extendsFrom compileOnly
            tutorialRuntimeOnly.extendsFrom runtimeOnly
        }
        p.minecraft.runs.server {
            mods {
                arienteworld {
                    source p.sourceSets.main
                    source p.sourceSets.tutorial
                }
            }
            workingDirectory p.file(p.findProperty('tutorial_directory') ?: 'build/tutorial/server')
            property 'ariente.tutorial', 'true'
            property 'ariente.tutorial.verify', (p.findProperty('tutorial_verify') ?: 'false').toString()
            property 'forge.logging.console.level', 'info'
            args '--nogui'
        }
        def soundCheck = p.hasProperty('tutorial_forcefield_sound_check')
        if (p.hasProperty('tutorial_preview') || soundCheck) {
            p.minecraft.runs.client {
                mods {
                    arienteworld {
                        source p.sourceSets.main
                        source p.sourceSets.tutorial
                    }
                }
                workingDirectory p.file(p.findProperty('tutorial_client_directory') ?: 'build/tutorial/client')
                property 'ariente.tutorial.fabulous', p.hasProperty('tutorial_fabulous').toString()
                property 'ariente.tutorial.preview', (!soundCheck).toString()
                property 'ariente.tutorial.forcefieldSoundCheck', soundCheck.toString()
                property 'ariente.tutorial.soundBaseline', p.hasProperty('tutorial_sound_baseline').toString()
                property 'ariente.tutorial.scene', (p.findProperty('tutorial_scene') ?: '0').toString()
                args '--quickPlaySingleplayer', 'Tutorial', '--width', '1280', '--height', '800'
            }
        }
        if (p.hasProperty('tutorial_render_mods')) {
            p.dependencies.add('runtimeOnly', p.fg.deobf('curse.maven:embeddium-908741:5681725'))
            p.dependencies.add('runtimeOnly', p.fg.deobf('curse.maven:oculus-581495:6020952'))
        }
        p.tasks.withType(JavaExec).configureEach {
            if (name == 'runServer' || (name == 'runClient' && (p.hasProperty('tutorial_preview') || soundCheck))) {
                dependsOn p.tasks.named('tutorialClasses')
            }
        }
    }
}
