// From the workspace: ./gradlew :ArienteWorld:build :ArienteWorld:runGameTestServer
//     -Pariente_runs -I ArienteWorld/tools/cube_landing_tests.gradle
gradle.afterProject { p ->
    if (p.name == 'ArienteWorld') {
        p.sourceSets.gameTest.java.setIncludes(['mcjty/arienteworld/CubeLandingTests.java',
                'mcjty/arienteworld/CubeAndVehicleTests.java', 'mcjty/arienteworld/DungeonExpansionTests.java'])
        def classes = p.layout.buildDirectory.dir('verification/cube-landing-tests/test-classes')
        p.tasks.named('compileGameTestJava').configure { destinationDirectory.set(classes) }
        p.sourceSets.gameTest.output.classesDirs.setFrom(classes)
        p.minecraft.runs.gameTestServer {
            workingDirectory p.file('build/verification/cube-landing-tests')
        }
    }
}
